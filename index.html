<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高自由度座位狀態管理 App</title>

    <!-- 桌面捷徑與縮圖設定 -->
    <link rel="icon" type="image/jpeg" href="20261109_075606(0).jpg">
    <link rel="apple-touch-icon" href="20261109_075606(0).jpg">
    <meta name="theme-color" content="#4a90e2">

    <style>
        :root {
            --primary: #4a90e2;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            padding: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
            text-align: center;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: #eef2f7;
            border: 1px solid #d0d7de;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: #444;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background: #dbe4ee;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .stat-item {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* 網格區塊 */
        .grid-container {
            display: grid;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .seat-card {
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            border: 2px solid;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 65px;
        }

        .seat-card:active {
            transform: scale(0.93);
        }

        .seat-name {
            font-size: 0.7rem;
            opacity: 0.75;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        .seat-val {
            font-size: 1.3rem;
            font-weight: 900;
            line-height: 1;
        }

        /* 設定面板 Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #666;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="title" id="appTitle">座位狀態控制表</div>
    
    <div class="controls">
        <button class="btn" onclick="openSettings()">⚙️ 佈局與名稱設定</button>
        <button class="btn" onclick="resetAllStates()">🔄 重置全部狀態</button>
    </div>

    <div class="stats-bar" id="statsBar"></div>
</div>

<!-- 網格容器 -->
<div class="grid-container" id="gridContainer"></div>

<!-- 設定 Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">⚙️ 網格與名稱設定</div>
        
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>列數 (Rows):</label>
                <input type="number" id="inputRows" min="1" max="50">
            </div>
            <div class="form-group" style="flex:1;">
                <label>欄數 (Cols):</label>
                <input type="number" id="inputCols" min="1" max="10">
            </div>
        </div>

        <div class="form-group">
            <label>座位名稱（用逗號或換行隔開）：</label>
            <textarea id="inputNames" rows="5" placeholder="例如：張三, 李四, 王五..."></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn" onclick="closeSettings()">取消</button>
            <button class="btn" style="background: var(--primary); color: white;" onclick="saveSettings()">儲存設定</button>
        </div>
    </div>
</div>

<script>
    // 1. 狀態與色彩對應表 (7種獨特顏色)
    const WORDS = ["空", "A", "B", "C", "素", "外", "否"];
    const COLOR_MAP = {
        "空": { bg: "#f1f3f5", border: "#ced4da", text: "#495057" },
        "A":  { bg: "#e6f4ea", border: "#34a853", text: "#137333" },
        "B":  { bg: "#e8f0fe", border: "#4285f4", text: "#1a73e8" },
        "C":  { bg: "#fef7e0", border: "#fbbc04", text: "#b06000" },
        "素": { bg: "#f3e8fd", border: "#a142f4", text: "#681da8" },
        "外": { bg: "#feefe3", border: "#fa7b17", text: "#c5221f" },
        "否": { bg: "#fce8e6", border: "#ea4335", text: "#c5221f" }
    };

    // 2. 預設資料
    let config = JSON.parse(localStorage.getItem('custom_grid_config')) || {
        rows: 10,
        cols: 2,
        names: Array.from({length: 20}, (_, i) => `座位 ${String(i + 1).padStart(2, '0')}`)
    };

    let seatStates = JSON.parse(localStorage.getItem('custom_grid_states')) || Array(20).fill(0);

    const container = document.getElementById('gridContainer');
    const statsBar = document.getElementById('statsBar');

    // 3. 渲染主畫面
    function renderGrid() {
        const total = config.rows * config.cols;
        
        // 確保陣列長度正確
        if (seatStates.length !== total) {
            seatStates = Array(total).fill(0);
        }

        // 設定動態 Grid
        container.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;

        // 生成 Html
        let html = '';
        for (let i = 0; i < total; i++) {
            const stateIdx = seatStates[i] || 0;
            const word = WORDS[stateIdx];
            const color = COLOR_MAP[word] || COLOR_MAP["空"];
            const name = config.names[i] || `座位 ${i + 1}`;

            html += `
                <div class="seat-card" data-index="${i}" style="background-color: ${color.bg}; border-color: ${color.border}; color: ${color.text};">
                    <div class="seat-name">${name}</div>
                    <div class="seat-val">${word}</div>
                </div>
            `;
        }
        container.innerHTML = html;

        // 更新統計人數
        updateStats();

        // 儲存至本地
        localStorage.setItem('custom_grid_config', JSON.stringify(config));
        localStorage.setItem('custom_grid_states', JSON.stringify(seatStates));
    }

    // 4. 更新統計
    function updateStats() {
        const counts = {};
        WORDS.forEach(w => counts[w] = 0);
        seatStates.forEach(idx => counts[WORDS[idx]]++);

        statsBar.innerHTML = WORDS.map(w => {
            const c = COLOR_MAP[w];
            return `<span class="stat-item" style="background:${c.bg}; color:${c.text}; border: 1px solid ${c.border};">${w}: ${counts[w]}</span>`;
        }).join('');
    }

    // 5. 事件委派：點擊切換狀態
    container.addEventListener('click', (e) => {
        const card = e.target.closest('.seat-card');
        if (!card) return;

        const idx = parseInt(card.getAttribute('data-index'));
        seatStates[idx] = (seatStates[idx] + 1) % WORDS.length;
        renderGrid();
    });

    // 6. 重置所有狀態
    function resetAllStates() {
        if (confirm("確定要將所有座位重置為「空」嗎？")) {
            seatStates = Array(config.rows * config.cols).fill(0);
            renderGrid();
        }
    }

    // 7. Modal 設定視窗邏輯
    function openSettings() {
        document.getElementById('inputRows').value = config.rows;
        document.getElementById('inputCols').value = config.cols;
        document.getElementById('inputNames').value = config.names.join(', ');
        document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
        const r = parseInt(document.getElementById('inputRows').value) || 1;
        const c = parseInt(document.getElementById('inputCols').value) || 1;
        const rawNames = document.getElementById('inputNames').value;

        // 拆分名稱
        let nameArray = rawNames.split(/[,\n]/).map(s => s.trim()).filter(s => s.length > 0);
        
        const total = r * c;
        // 若輸入的名稱數量不足，自動補齊預設編號
        while (nameArray.length < total) {
            nameArray.push(`座位 ${String(nameArray.length + 1).padStart(2, '0')}`);
        }

        config.rows = r;
        config.cols = c;
        config.names = nameArray.slice(0, total);
        seatStates = Array(total).fill(0); // 重新規劃尺寸時重置狀態

        closeSettings();
        renderGrid();
    }

    // 初始化渲染
    renderGrid();
</script>
</body>
</html>
